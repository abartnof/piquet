[project]
name = "piquet"
version = "0.1.0"
description = "The historical two-player card game Piquet: engine, opponents, and an interactive tutor."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piquet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Statistical tests play thousands of deals. They run by default -- they have
# caught more real bugs than the unit tests have -- but `pytest -m "not slow"`
# gives a fast loop while iterating.
markers = ["slow: plays many deals; seconds rather than milliseconds"]
