[project]
name = "piquet"
version = "0.1.0"
description = "The historical two-player card game Piquet: engine, opponents, and an interactive tutor."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piquet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
